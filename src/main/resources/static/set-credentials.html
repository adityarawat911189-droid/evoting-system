<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Credentials - E-Voting System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            max-width: 480px;
            width: 100%;
            padding: 2rem;
            border-radius: 12px;
        }
        .step-indicator {
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 1.5rem;
        }
        .brand-title {
            font-weight: 600;
            color: #0d6efd;
        }
        .form-text-hint {
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<div class="card shadow-sm register-card">
    <h4 class="brand-title text-center mb-1">E-Voting System</h4>
    <p class="text-center text-muted mb-4">Voter Registration</p>

    <div class="step-indicator text-center">Step 4 of 5 &mdash; Set Password &amp; PIN</div>

    <form id="credentialsForm">
        <div class="mb-3">
            <label for="password" class="form-label">Create Password</label>
            <input type="password" class="form-control" id="password" placeholder="At least 8 characters" required>
            <div class="form-text form-text-hint">You'll use this along with your EPIC number to log in.</div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required>
        </div>

        <div class="mb-3">
            <label for="pin" class="form-label">Create Voting PIN</label>
            <input type="password" class="form-control" id="pin" placeholder="4 to 6 digits" maxlength="6" required>
            <div class="form-text form-text-hint">You'll need this PIN, along with your fingerprint, every time you cast a vote.</div>
        </div>

        <div class="mb-3">
            <label for="confirmPin" class="form-label">Confirm PIN</label>
            <input type="password" class="form-control" id="confirmPin" placeholder="Re-enter PIN" maxlength="6" required>
        </div>

        <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
        <div id="successMsg" class="alert alert-success d-none" role="alert"></div>

        <button type="submit" class="btn btn-primary w-100 py-2">Continue</button>
    </form>
</div>

<script>
    const epicNumber = sessionStorage.getItem('reg_epicNumber');
    if (!epicNumber) {
        window.location.href = 'register.html';
    }

    const errorDiv = document.getElementById('errorMsg');
    const successDiv = document.getElementById('successMsg');

    function showError(msg) {
        errorDiv.textContent = msg;
        errorDiv.classList.remove('d-none');
        successDiv.classList.add('d-none');
    }

    document.getElementById('credentialsForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const pin = document.getElementById('pin').value;
        const confirmPin = document.getElementById('confirmPin').value;

        if (password.length < 8) {
            showError('Password must be at least 8 characters.');
            return;
        }
        if (password !== confirmPassword) {
            showError('Passwords do not match.');
            return;
        }
        if (!/^\d{4,6}$/.test(pin)) {
            showError('PIN must be 4 to 6 digits.');
            return;
        }
        if (pin !== confirmPin) {
            showError('PINs do not match.');
            return;
        }

        try {
            const response = await fetch('http://localhost:8080/api/register/set-credentials', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ epicNumber: epicNumber, password: password, pin: pin })
            });

            const data = await response.json();

            if (data.verified) {
                successDiv.textContent = 'Credentials set! Redirecting to fingerprint setup...';
                successDiv.classList.remove('d-none');
                errorDiv.classList.add('d-none');

                setTimeout(function () {
                    window.location.href = 'fingerprint-register.html';
                }, 1500);
            } else {
                showError(data.message || 'Failed to set credentials.');
            }
        } catch (err) {
            showError('Something went wrong. Is the server running?');
            console.error(err);
        }
    });
</script>

</body>
</html>
